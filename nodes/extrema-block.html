<script type="text/html" data-template-name="extrema-block">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name">
    </div>
    <div class="form-row">
        <label for="node-input-slots" title="Number of numeric virtual inputs (integer >= 2)"><i class="fa fa-list"></i> Slots</label>
        <input type="number" id="node-input-slots" placeholder="2" min="2" step="1">
    </div>
    <div class="form-row">
        <label for="node-input-mode"><i class="fa fa-sort-amount-asc"></i> Mode</label>
        <select id="node-input-mode">
            <option value="minimum">Minimum</option>
            <option value="maximum">Maximum</option>
        </select>
    </div>
    <div class="form-row">
        <label for="node-input-operationMode"><i class="fa fa-random"></i> Operation</label>
        <select id="node-input-operationMode">
            <option value="map">Map message properties</option>
            <option value="context">Context</option>
        </select>
    </div>
    <div class="form-row">
        <label for="node-input-outputProperty"><i class="fa fa-arrow-right"></i> Output Property</label>
        <input type="text" id="node-input-outputProperty" placeholder="payload">
    </div>
    <div id="node-input-mappings-row" class="form-row">
        <label><i class="fa fa-exchange"></i> Mappings</label>
        <ol id="node-input-mapping-container"></ol>
        <a href="#" id="node-input-add-mapping" class="red-ui-button" style="margin-top: 5px;">Add mapping</a>
    </div>
</script>

<script type="text/javascript">
    (function() {
    function compareMappings(left, right) {
        const inputDifference = Number(left.input) - Number(right.input);
        return inputDifference || left.property.localeCompare(right.property);
    }

    RED.nodes.registerType("extrema-block", {
        category: "bldgblocks control",
        color: "#301934",
        defaults: {
            name: { value: "" },
            slots: { value: 2, required: true, validate: value => !isNaN(parseInt(value, 10)) && parseInt(value, 10) >= 2 },
            mode: { value: "minimum" },
            operationMode: { value: "map" },
            outputProperty: { value: "payload", required: true },
            mappings: { value: [] }
        },
        inputs: 1,
        outputs: 1,
        inputLabels: ["input"],
        outputLabels: ["result"],
        icon: "font-awesome/fa-sort-amount-asc",
        paletteLabel: "extrema",
        label: function() {
            return this.name || `${this.mode || "minimum"} (${this.slots || 2})`;
        },
        oneditprepare: function() {
            const node = this;
            const $container = $("#node-input-mapping-container");
            const $mappingRow = $("#node-input-mappings-row");
            const markDirty = () => RED.nodes.dirty(true);
            if (!node.outputProperty || !node.outputProperty.trim()) $("#node-input-outputProperty").val("payload");

            function addMapping(mapping) {
                const $item = $("<li>", { class: "node-input-mapping-row", style: "display: flex; align-items: center; gap: 5px; width: 100%; box-sizing: border-box; flex-wrap: nowrap;" }).appendTo($container);
                $("<input>", { type: "text", class: "node-input-mapping-property", placeholder: "temperature", style: "flex: 1 1 80px; min-width: 0;" }).val(mapping.property || "").on("input", markDirty).appendTo($item);
                $("<input>", { type: "number", class: "node-input-mapping-input", min: 1, step: 1, style: "width: 50px; flex: 0 0 50px;", title: "Virtual input number" }).val(mapping.input || 1).on("change", markDirty).appendTo($item);
                $("<a>", { href: "#", class: "red-ui-button red-ui-button-small", style: "flex: 0 0 auto; margin: 0;" }).html('<i class="fa fa-remove"></i>').on("click", function(event) {
                    event.preventDefault();
                    $item.remove();
                    markDirty();
                }).appendTo($item);
            }

            (node.mappings || []).slice().sort(compareMappings).forEach(addMapping);
            $("#node-input-add-mapping").on("click", function(event) {
                event.preventDefault();
                addMapping({ property: "", input: 1 });
                markDirty();
            });
            $("#node-input-operationMode").on("change", function() {
                $mappingRow.toggle($(this).val() === "map");
            }).trigger("change");
        },
        oneditsave: function() {
            this.mappings = $("#node-input-mapping-container .node-input-mapping-row").map(function() {
                const property = $(this).find(".node-input-mapping-property").val().trim();
                const input = parseInt($(this).find(".node-input-mapping-input").val(), 10);
                return property && input >= 1 ? { property, input } : null;
            }).get().filter(Boolean).sort(compareMappings);
        }
    });
    })();
</script>

<script type="text/markdown" data-help-name="extrema-block">
Finds the minimum or maximum value across numeric virtual input slots.

### Inputs
: map mode (default) : Each configured message property updates its mapped virtual input.
: context mode : `msg.context` identifies the input slot (`"in1"`, `"in2"`, and so on); `msg.payload` supplies its numeric value.

### Outputs
: configured output property (number) : The selected minimum or maximum value. Defaults to `msg.payload`.

### Details
Each received value updates the corresponding virtual input; values in other slots are retained. The node then emits the smallest or largest value across all slots, according to **Mode**. In map mode, one message may update several slots.
</script>
