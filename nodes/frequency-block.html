<!-- UI Template Section: Defines the edit dialog -->
<script type="text/html" data-template-name="frequency-block">
    <div class="form-row">
        <label for="node-input-name" title="Display name shown on the canvas"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name">
    </div>
    <div class="form-row">
        <label for="node-input-inputProperty" title="Message property to read input from"><i class="fa fa-folder-open"></i> Input Property</label>
        <input type="text" id="node-input-inputProperty" placeholder="payload">
    </div>
    <div class="form-row">
        <label for="node-input-outputProperty" title="Message property to write the result to"><i class="fa fa-arrow-right"></i> Output Property</label>
        <input type="text" id="node-input-outputProperty" placeholder="payload">
    </div>
</script>

<!-- JavaScript Section: Registers the node and handles editor logic -->
<script type="text/javascript">
    RED.nodes.registerType("frequency-block", {
        category: "bldgblocks control",
        color: "#301934",
        defaults: {
            name: { value: "" },
            inputProperty: { value: "payload" },
            outputProperty: { value: "payload", required: true }
        },
        inputs: 1,
        outputs: 1,
        inputLabels: ["input"],
        outputLabels: ["stats"],
        icon: "font-awesome/fa-tachometer",
        paletteLabel: "frequency",
        label: function() {
            return this.name || "frequency";
        },
        oneditprepare: function() {
            if (!this.outputProperty || !this.outputProperty.trim()) {
                $("#node-input-outputProperty").val("payload");
            }
        }
    });
</script>

<!-- Help Section -->
<script type="text/markdown" data-help-name="frequency-block">
Measures pulse frequency from boolean rising edges.

### Inputs
: context (string) : Resets state (`"reset"`). Unmatched values trigger error.
: payload (boolean) : Input boolean to detect rising edges (`true` for pulse).

### Outputs
: outputProperty (object) : Pulse statistics, written to the configured Output Property.

### Properties
: inputProperty (string) : Message property to read the boolean pulse from (default: `payload`).
: outputProperty (string) : Message property to write pulse statistics to (default: `payload`). Supports nested properties.

### Details
Measures pulse frequency from rising edges in the configured input property, outputting `{ ppm, pph, ppd, dutyCycle, onTime }` to the configured output property on rising edges 
(first edge sets baseline). Resets state via `msg.context = "reset"` with `msg.payload = true`.

Outputs a duty cycle in percentage of the last 60 minutes that the signal has been true.

Periods of 1 ms or longer are measured directly. Faster pulses are clamped to 1,000 pulses/second: 60,000 ppm, 3,600,000 pph, and 86,400,000 ppd.

### Status
- Green (dot): Configuration
- Blue (dot): Output, no alarm
- Red (dot): Output with alarm
- Red (ring): Errors
- Yellow (ring): Unknown context

### References
- [Node-RED Documentation](https://nodered.org/docs/)
- [GitHub Repository](https://github.com/BldgBlocks/node-red-contrib-buildingblocks-control.git)
</script>
