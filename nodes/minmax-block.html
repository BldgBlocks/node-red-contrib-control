<!-- UI Template Section: Defines the edit dialog -->
<script type="text/html" data-template-name="minmax-block">
    <div class="form-row">
        <label for="node-input-name" title="Display name shown on the canvas"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name">
    </div>
    <div class="form-row">
        <label for="node-input-mode" title="Select the clamp bounds"><i class="fa fa-sort-amount-asc"></i> Mode</label>
        <select id="node-input-mode">
            <option value="min">Minimum</option>
            <option value="max">Maximum</option>
            <option value="minmax">Minimum and Maximum</option>
        </select>
    </div>
    <div id="node-input-min-row" class="form-row">
        <label for="node-input-min" title="Minimum output value"><i class="fa fa-arrow-down"></i> Minimum</label>
        <input type="text" id="node-input-min" placeholder="0">
        <input type="hidden" id="node-input-minType">
    </div>
    <div id="node-input-max-row" class="form-row">
        <label for="node-input-max" title="Maximum output value"><i class="fa fa-arrow-up"></i> Maximum</label>
        <input type="text" id="node-input-max" placeholder="100">
        <input type="hidden" id="node-input-maxType">
    </div>
</script>

<!-- JavaScript Section: Registers the node and handles editor logic -->
<script type="text/javascript">
    RED.nodes.registerType("minmax-block", {
        category: "bldgblocks control",
        color: "#301934",
        defaults: {
            name: { value: "" },
            mode: { value: "minmax" },
            min: { value: 0, required: true },
            minType: { value: "num" },
            max: { value: 100, required: true },
            maxType: { value: "num" }
        },
        inputs: 1,
        outputs: 1,
        inputLabels: ["input"],
        outputLabels: ["output"],
        icon: "font-awesome/fa-sort-amount-asc",
        paletteLabel: "min/max clamp",
        label: function() {
            const labels = { min: "min clamp", max: "max clamp", minmax: "min/max clamp" };
            return this.name || labels[this.mode] || labels.minmax;
        },
        oneditprepare: function() {
            const node = this;
            $("#node-input-min").typedInput({
                default: "num",
                types: ["num", "msg", "flow", "global"],
                typeField: "#node-input-minType"
            }).typedInput("type", node.minType || "num").typedInput("value", node.min);
            $("#node-input-max").typedInput({
                default: "num",
                types: ["num", "msg", "flow", "global"],
                typeField: "#node-input-maxType"
            }).typedInput("type", node.maxType || "num").typedInput("value", node.max);
            $("#node-input-mode").on("change", function() {
                const mode = $(this).val();
                $("#node-input-min-row").toggle(mode !== "max");
                $("#node-input-max-row").toggle(mode !== "min");
            }).trigger("change");
        }
    });
</script>

<!-- Help Section -->
<script type="text/markdown" data-help-name="minmax-block">
Clamps a numeric input to a selected minimum, maximum, or both limits.

### Inputs
: context (string) : Updates a configured limit using `"min"` / `"minimum"` or `"max"` / `"maximum"`. `"setpoint"` updates the single selected limit in minimum or maximum mode.
: payload (number) : Input number to clamp or the selected limit value when using a configuration context.

### Outputs
: payload (number) : The clamped number.

### Properties
: mode : Select **Minimum**, **Maximum**, or **Minimum and Maximum** to constrain a range.
: minimum / maximum : Numeric clamp limits, supporting number, message, flow, and global values.

### Details
In **Minimum** mode, outputs below the configured limit are raised to that limit. In **Maximum** mode, outputs above the configured limit are lowered to that limit. In **Minimum and Maximum** mode, the result is constrained to the configured inclusive range. The node forwards the input message with its `payload` replaced by the clamped result.

### Status
- Green (dot): Limit update
- Blue (dot): Output changed
- Blue (ring): Output unchanged
- Red (ring): Invalid input or limit
- Yellow (ring): Unknown context

### References
- [Node-RED Documentation](https://nodered.org/docs/)
- [GitHub Repository](https://github.com/BldgBlocks/node-red-contrib-buildingblocks-control.git)
</script>
