<!-- UI Template Section: Defines the edit dialog -->
<script type="text/html" data-template-name="priority-block">
    <div class="form-row">
        <label for="node-input-name" title="Display name shown on the canvas"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name">
    </div>
    <div class="form-row">
        <label for="node-input-operationMode" title="How incoming messages update priority slots"><i class="fa fa-random"></i> Operation</label>
        <select id="node-input-operationMode">
            <option value="map">Map message properties</option>
            <option value="context">Context (legacy)</option>
        </select>
    </div>
    <div id="node-input-mappings-row" class="form-row">
        <label><i class="fa fa-exchange"></i> Mappings</label>
        <ol id="node-input-mapping-container"></ol>
        <a href="#" id="node-input-add-mapping" class="red-ui-button" style="margin-top: 5px;">Add mapping</a>
    </div>
</script>

<!-- JavaScript Section: Registers the node and handles editor logic -->
<script type="text/javascript">
    RED.nodes.registerType("priority-block", {
        category: "bldgblocks control",
        color: "#301934",
        defaults: {
            name: { value: "" },
            operationMode: { value: "map" },
            mappings: { value: [] }
        },
        inputs: 1,
        outputs: 1,
        inputLabels: ["input"],
        outputLabels: ["output"],
        icon: "font-awesome/fa-list-ol",
        paletteLabel: "priority",
        label: function() {
            return this.name || "priority";
        },
        oneditprepare: function() {
            const node = this;
            const $container = $("#node-input-mapping-container");
            const $mappingRow = $("#node-input-mappings-row");

            function addMapping(mapping) {
                const $item = $("<li>", { class: "node-input-mapping-row" }).appendTo($container);
                $("<input>", {
                    type: "text",
                    class: "node-input-mapping-property",
                    placeholder: "payload.temperature"
                }).val(mapping.property || "").appendTo($item);

                const $slot = $("<select>", {
                    class: "node-input-mapping-slot",
                    style: "width: 120px; margin-left: 6px;",
                    title: "Priority slot"
                }).appendTo($item);
                for (let priority = 1; priority <= 16; priority++) {
                    $("<option>", { value: `priority${priority}`, text: `priority${priority}` }).appendTo($slot);
                }
                $("<option>", { value: "fallback", text: "fallback" }).appendTo($slot);
                $slot.val(mapping.slot || "priority1");

                $("<a>", { href: "#", class: "red-ui-button red-ui-button-small", style: "margin-left: 5px;" })
                    .html('<i class="fa fa-remove"></i>')
                    .on("click", function(event) {
                        event.preventDefault();
                        $item.remove();
                    })
                    .appendTo($item);
            }

            (node.mappings || []).slice().sort((left, right) => left.property.localeCompare(right.property)).forEach(addMapping);
            $("#node-input-add-mapping").on("click", function(event) {
                event.preventDefault();
                addMapping({ property: "", slot: "priority1" });
            });
            $("#node-input-operationMode").on("change", function() {
                $mappingRow.toggle($(this).val() === "map");
            }).trigger("change");
        },
        oneditsave: function() {
            this.mappings = $("#node-input-mapping-container .node-input-mapping-row").map(function() {
                const property = $(this).find(".node-input-mapping-property").val().trim();
                const slot = $(this).find(".node-input-mapping-slot").val();
                return property ? { property, slot } : null;
            }).get().filter(Boolean).sort((left, right) => left.property.localeCompare(right.property));
        }
    });
</script>

<!-- Help Section -->
<script type="text/markdown" data-help-name="priority-block">
Implements a priority array with 16 levels, default, and fallback.

### Inputs
: map mode (default) : Each configured message property updates its mapped priority slot.
: context mode : `context` is the command/slot identifier and `payload` is the slot value.

#### Map mode
Configure a message property and target slot for each input. Nested properties such as `payload.temperature` are supported. The mapped value is stored in its slot; `null` or an empty string relinquishes it. A message may update multiple mapped slots.

#### Context mode
: context (string) : Command/slot identifier.
    - `"priority1"` to `"priority16"`: set or relinquish priority slots.
    - `"fallback"`: set or relinquish fallback slot.
    - `"clear"`: clear all priority slots (`priority1` to `priority16`) in one command.
    - `"default"`: runtime updates are ignored (default is fixed).
: payload (number | boolean | string | null) :
    - For `priorityX` and `fallback`: `number`, `boolean`, or `string` values are accepted.
    - `null` or empty string (`""`) relinquishes the targeted runtime-writable slot.
    - For `context: "clear"`, payload is ignored.
    - Object-based clear payloads are not supported.

### Outputs
: payload (any) : Value from highest non-null slot (`priority1` to `fallback`), or `null` if none set.
: diagnostics.activePriority (string) : Active slot (`"priority1"` to `"priority16"`, `"default"`, `"fallback"`, or `null`).
: *other* (any) : the original message is preserved.

### Details
Manages a priority array with 16 slots (`priority1` to `priority16`), `default`, and `fallback`. 

Forwards the original message from the highest non-null slot (`priority1` highest, `fallback` lowest), moves the selected value to `msg.payload`, and adds `msg.diagnostics.activePriority`.

If no slots are set, outputs `{ payload null, diagnostics { activePriority null } }`. 
In map mode, mapped `null` or empty-string values relinquish individual slots. In context mode, set runtime slots via `msg.context` + `msg.payload` and clear all priorities with `msg.context = "clear"`.
`default` is treated as fixed and is not changed by runtime messages.

### Status
- Green (dot): Configuration
- Blue (dot): Output, no alarm
- Red (dot): Output with alarm
- Red (ring): Errors
- Yellow (ring): Unknown context

### References
- [Node-RED Documentation](https://nodered.org/docs/)
- [GitHub Repository](https://github.com/BldgBlocks/node-red-contrib-buildingblocks-control.git)
</script>
