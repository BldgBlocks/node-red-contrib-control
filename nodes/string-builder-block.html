<!-- UI Template Section: Defines the edit dialog -->
<script type="text/html" data-template-name="string-builder-block">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name">
    </div>
    <div class="form-row node-input-entries-row" style="margin-bottom: 0;">
        <label><i class="fa fa-list"></i> Fields</label>
    </div>
    <div class="form-row node-input-entries-row">
        <ol id="node-input-entry-container"></ol>
    </div>
    <div class="form-row">
        <label for="node-input-outputProperty" title="Message property to write the result to"><i class="fa fa-arrow-right"></i> Output Property</label>
        <input type="text" id="node-input-outputProperty" placeholder="payload">
    </div>
</script>


<!-- JavaScript Section: Registers the node and handles editor logic -->
<script type="text/javascript">
    RED.nodes.registerType("string-builder-block", {
    category: "bldgblocks control",
    color: "#301934",
    defaults: {
        name: { value: "" },
        in1: { value: "", required: false },
        in1Type: { value: "str" },
        in2: { value: "", required: false },
        in2Type: { value: "str" },
        in3: { value: "", required: false },
        in3Type: { value: "str" },
        in4: { value: "", required: false },
        in4Type: { value: "str" },
        entries: { value: [] },
        entriesConfigured: { value: false },
        outputProperty: { value: "payload", required: true },
    },
    inputs: 1,
    outputs: 1,
    inputLabels: ["input"],
    outputLabels: ["output"],
    icon: "font-awesome/fa-bars",
    paletteLabel: "string builder",
    label: function() {
        return this.name || "string builder";
    },
    oneditprepare: function() {
        const node = this;

        try {
            const entryContainer = $("#node-input-entry-container").css("min-height", "200px").editableList({
                addItem: function(container, index, entry) {
                    entry = entry || { value: "", type: "str" };
                    const row = $("<div/>", { style: "display:flex;align-items:center;width:100%;" }).appendTo(container);
                    const valueInput = $("<input/>", {
                        type: "text",
                        class: "node-input-entry-value",
                        style: "width:100%;"
                    }).appendTo(row);

                    valueInput.typedInput({
                        default: "str",
                        types: ["str", "msg", "flow", "global"]
                    }).typedInput("type", entry.type || "str").typedInput("value", entry.value == null ? "" : entry.value);
                },
                removable: true,
                sortable: true
            });

            const entries = node.entriesConfigured || (Array.isArray(node.entries) && node.entries.length > 0)
                ? node.entries
                : [1, 2, 3, 4].map(function(index) {
                    return {
                        value: node[`in${index}`] == null ? "" : node[`in${index}`],
                        type: node[`in${index}Type`] || "str"
                    };
                });
            entries.forEach(function(entry) {
                entryContainer.editableList("addItem", entry);
            });

            if (!node.outputProperty || !node.outputProperty.trim()) {
                $("#node-input-outputProperty").val("payload");
            }

        } catch (err) {
            console.error("Error in oneditprepare:", err);
        }
        },
        oneditsave: function() {
            this.entries = $("#node-input-entry-container").editableList("items").map(function() {
                const valueInput = $(this).find(".node-input-entry-value");
                return {
                    value: valueInput.typedInput("value"),
                    type: valueInput.typedInput("type")
                };
            }).get();
            this.entriesConfigured = true;
            const outputProperty = $("#node-input-outputProperty").val().trim();
            this.outputProperty = outputProperty || "payload";
            $("#node-input-outputProperty").val(this.outputProperty);
        }
});
</script>

<!-- Help Section -->
<script type="text/markdown" data-help-name="string-builder-block">
Concatenates multiple string inputs into a single output string on any input.

### Inputs
: payload (number) : Input value to evaluate
: context (string) : Configure string fields by position using `in1`, `in2`, and so on

### Outputs
: outputProperty (string) : Each configured field concatenated in list order

### Properties
: fields (array) : Ordered string, message, flow, or global values to concatenate
: outputProperty (string) : Message property to write the result to (default: `payload`)

### Status
- Green (dot): Configuration update
- Blue (dot): State changed
- Blue (ring): State unchanged
- Red (ring): Error
- Yellow (ring): Warning

### References
- [Node-RED Documentation](https://nodered.org/docs/)
- [GitHub Repository](https://github.com/BldgBlocks/node-red-contrib-buildingblocks-control.git)
</script>
